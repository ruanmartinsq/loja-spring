spring.application.name=happynation

#Configuracao do banco de dados em memoria H2
spring.datasource.url=jdbc:h2:mem:bancobolado
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=ruanq
spring.datasource.password=


#Habilitar console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Configuracao do HIBERNATE - DDL automatico do hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

